name: build-windows-exe

# Builds the portable "no-install" Windows bundle:
#   dist/GBVMonitor/GBVMonitor.exe + bundled llama.cpp engine + the chosen GGUF
#   model + bundled Chromium. Produces:
#     * GBVMonitor-app-no-model.zip   — the app WITHOUT the AI model (<2 GB)
#     * GBVMonitor-models.zip.001..N  — the model split into <=1.5 GB parts
#     * (optional draft GitHub release with the FULL bundle, split parts)
#
# Recombining parts on Windows:  copy /b GBVMonitor-models.zip.001+GBVMonitor-models.zip.002+... GBVMonitor-models.zip
# then unzip both next to each other into ONE folder and run GBVMonitor.exe.

on:
  workflow_dispatch:
    inputs:
      chat_prefix:
        description: "GGUF prefix to bundle (ggml-org/Qwen2.5-VL-7B-Instruct-GGUF). Example alternatives: Qwen2.5-7B-Instruct-Q4_K_M (from Qwen/Qwen2.5-7B-Instruct-GGUF, text-only)"
        required: false
        default: "Qwen2.5-VL-7B-Instruct-Q4_K_M"
      no_vision:
        description: "Omit the mmproj vision tower (~1.3 GB smaller; image screening disabled)"
        type: boolean
        required: false
        default: false
      backends:
        description: "llama.cpp engines to ship (cpu is always included)"
        required: false
        default: "cpu,vulkan"
      publish_release:
        description: "Also create a DRAFT GitHub release containing the full bundle"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      CHAT_PREFIX: ${{ inputs.chat_prefix || 'Qwen2.5-VL-7B-Instruct-Q4_K_M' }}
      NO_VISION: ${{ inputs.no_vision == true && '1' || '' }}
      BACKENDS: ${{ inputs.backends || 'cpu,vulkan' }}
      PUBLISH_RELEASE: ${{ inputs.publish_release == true && '1' || '' }}
      # Windows runners default to cp1252; make every Python process UTF-8 safe
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Fetch engine + models
        shell: pwsh
        run: |
          $fa = @("--dest", ".",
                   "--backends", "$env:BACKENDS",
                   "--chat-repo", "ggml-org/Qwen2.5-VL-7B-Instruct-GGUF",
                   "--chat-prefix", "$env:CHAT_PREFIX",
                   "--embed-repo", "nomic-ai/nomic-embed-text-v1.5-GGUF",
                   "--embed-file", "nomic-embed-text-v1.5.Q8_0.gguf")
          if ($env:NO_VISION -eq "1") { $fa += "--no-vision" }
          python packaging/fetch_assets.py @fa

      - name: Install bundled Chromium
        shell: pwsh
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$PWD/bundle-browsers" >> $env:GITHUB_ENV
          # GITHUB_ENV only takes effect in LATER steps — the call below runs in
          # THIS step, so set the variable in-process as well, else Playwright
          # downloads into the default %LOCALAPPDATA%\ms-playwright cache.
          $env:PLAYWRIGHT_BROWSERS_PATH = "$PWD\bundle-browsers"
          python -m playwright install chromium
          if (!(Test-Path "$PWD\bundle-browsers")) {
            throw "playwright did not install into bundle-browsers\ (check the output above)"
          }
          Write-Host "[chromium] bundle-browsers contains: $((Get-ChildItem "$PWD\bundle-browsers").Name -join ', ')"

      - name: PyInstaller
        run: python -m PyInstaller packaging/gbv_monitor.spec --noconfirm

      - name: Assemble distribution folder + zips
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path "dist/GBVMonitor/GBVMonitor.exe")) { throw "GBVMonitor.exe missing — check PyInstaller step" }

          # robocopy is a NATIVE tool: paths must use BACKSLASHES (forward slashes
          # are parsed as switches → "Invalid Parameter" → exit 16), and its
          # success codes 0–7 must be reset afterwards, else pwsh propagates
          # robocopy's exit code (1 = "files copied, OK") as the step's exit code.
          function Robo ([string]$src, [string]$dst) {
            robocopy $src $dst /E /NFL /NDL /NJH /NJS /NP
            $rc = $LASTEXITCODE
            if ($rc -ge 8) { throw "robocopy failed: '$src' -> '$dst' (exit $rc)" }
            $global:LASTEXITCODE = 0
          }
          Robo runtime         dist\GBVMonitor\runtime
          Robo models          dist\GBVMonitor\models
          Robo bundle-browsers dist\GBVMonitor\ms-playwright
          Copy-Item packaging/DIST_README.txt dist/GBVMonitor/README.txt -Force
          New-Item -ItemType Directory -Force -Path dist/GBVMonitor/output | Out-Null
          New-Item -ItemType Directory -Force -Path dist/parts | Out-Null
          Copy-Item packaging/README-EXE.md dist/parts/HOW-TO-INSTALL.md -Force

          function Split-Zip {
            param([string]$Zip, [long]$ChunkSize = 1500MB)
            $size = (Get-Item $Zip).Length
            if ($size -le $ChunkSize) { return }
            Write-Host ("[split] {0} ({1:N2} GB)" -f $Zip, ($size / 1GB))
            $fs = [IO.File]::OpenRead($Zip)
            $buf = New-Object byte[] (64MB)
            $n = 0
            try {
              while ($fs.Position -lt $size) {
                $n++
                $out = "$Zip.$('{0:d3}' -f $n)"
                $outFs = [IO.File]::Create($out)
                try {
                  $remaining = $ChunkSize
                  while ($remaining -gt 0) {
                    $want = [int][Math]::Min([int64]$buf.Length, $remaining)
                    $read = $fs.Read($buf, 0, $want)
                    if ($read -le 0) { break }
                    $outFs.Write($buf, 0, $read)
                    $remaining -= $read
                  }
                } finally { $outFs.Close() }
              }
            } finally { $fs.Close() }
            Remove-Item $Zip -Force
          }

          # .NET ZipFile (not Compress-Archive): guaranteed Zip64 — required for
          # the 4.68 GB Qwen2.5-VL GGUF entry (> 4 GB legacy per-entry limit).
          # includeBaseDirectory=$true keeps the "models\..." root, like before.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function Zip-Dir ([string]$srcDir, [string]$zipFile, [bool]$withBase) {
            if (Test-Path $zipFile) { Remove-Item $zipFile -Force }
            [IO.Compression.ZipFile]::CreateFromDirectory(
              $srcDir, $zipFile,
              [IO.Compression.CompressionLevel]::Fastest, $withBase)
          }

          # ---- model pack (separate so the app zip stays small)
          Zip-Dir "dist\GBVMonitor\models" "dist\parts\GBVMonitor-models.zip" $true
          Split-Zip -Zip "dist\parts\GBVMonitor-models.zip"

          # ---- app without model (exe + engine + chromium + python runtime)
          $appPaths = @(Get-ChildItem dist/GBVMonitor | Where-Object { $_.Name -ne "models" } | ForEach-Object { $_.FullName })
          Compress-Archive -Path $appPaths -DestinationPath "dist\parts\GBVMonitor-app-no-model.zip" -Force -CompressionLevel Fastest
          Split-Zip -Zip "dist\parts\GBVMonitor-app-no-model.zip"
          Get-ChildItem dist/parts | ForEach-Object { Write-Host ("[parts] {0}  {1:N0} MB" -f $_.Name, ($_.Length / 1MB)) }

          # ---- full bundle zip: only needed for the DRAFT RELEASE (saves ~6 GB
          # of disk + minutes when you just want the artifact zips)
          if ($env:PUBLISH_RELEASE -eq "1") {
            Zip-Dir "dist\GBVMonitor" "dist\parts\GBVMonitor-full.zip" $false
            Split-Zip -Zip "dist\parts\GBVMonitor-full.zip"
          } else {
            Write-Host "[parts] publish_release not checked -> skipping the full-bundle zip"
          }

      - name: Upload artifacts (app + model parts)
        uses: actions/upload-artifact@v4
        with:
          name: GBVMonitor-bundle
          path: dist/parts/*
          if-no-files-found: error
          retention-days: 14

      - name: Draft release with full bundle
        if: env.PUBLISH_RELEASE == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portable-bundle-${{ github.run_number }}
          name: Portable GBV Monitor bundle (run ${{ github.run_number }})
          draft: true
          fail_on_unmatched_files: true
          # publish WHATEVER actually ended up in dist/parts (small zips stay
          # whole; big ones become .001/.002 parts) — a static mixed list would
          # always fail: after splitting, a zip exists as base OR parts, not both
          files: dist/parts/*
          body: |
            ## Install (Windows 10/11 x64)
            1. Download **all** attached parts into ONE folder (and `HOW-TO-INSTALL.md`).
            2. Reassemble, Windows CMD:
            ```
            copy /b GBVMonitor-full.zip.001+GBVMonitor-full.zip.002+… GBVMonitor-full.zip
            ```
            (same pattern for `-app-no-model` / `-models` if you downloaded those instead)
            3. Extract the zip (right-click → Extract All) and double-click **GBVMonitor.exe**
            — the built-in local model loads (15–90 s) and the interface opens in your browser.

            Everything runs locally on your machine; no cloud, no account.

      - name: Job summary (how to assemble)
        if: always()
        shell: pwsh
        run: |
          @"
          ## Portable GBV Monitor bundle
          Download **GBVMonitor-bundle** (or the draft release). Then:

          1. Put all parts in ONE folder.
          2. Reassemble (Windows CMD):
             ``copy /b GBVMonitor-full.zip.001+GBVMonitor-full.zip.002+… GBVMonitor-full.zip``
             (same pattern for `-models-` / `-app-no-model-` parts if you downloaded those instead)
          3. Unzip **GBVMonitor-full.zip** anywhere (right-click → Extract All).
          4. Double-click **GBVMonitor.exe** → console shows model loading → browser opens.

          Alternatives:
          - ``GBVMonitor-app-no-model.zip`` + ``GBVMonitor-models.zip.001…``: smaller download,
            reassemble both and unzip into the SAME folder.
          - The launcher also supports scheduler mode:
            ``GBVMonitor.exe monitor run-due --enrich`` (see README).
          "@ | Set-Content $env:GITHUB_STEP_SUMMARY
